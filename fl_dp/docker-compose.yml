version: "3.9"

# Federated Learning + DP-SGD — containerised demo
# Each client runs in its own container; they never share data.
# Only model updates (gradients) cross the network.
#
# Run:  docker compose up --build
# Logs: docker compose logs -f client-0

services:

  server:
    build: ./server
    container_name: fl-server
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/model')"]
      interval: 5s
      timeout: 3s
      retries: 10

  client-0:
    build: ./client
    container_name: fl-client-0
    depends_on:
      server:
        condition: service_healthy
    environment:
      SERVER_URL:       http://server:5000
      CLIENT_ID:        "0"
      NUM_CLIENTS:      "3"
      ROUNDS:           "10"
      LOCAL_EPOCHS:     "3"
      CLIP_NORM:        "1.0"     # C  — gradient clipping bound
      NOISE_MULTIPLIER: "1.1"     # σ  — noise scale (higher = more private)
      DELTA:            "1e-5"    # δ  — failure probability

  client-1:
    build: ./client
    container_name: fl-client-1
    depends_on:
      server:
        condition: service_healthy
    environment:
      SERVER_URL:       http://server:5000
      CLIENT_ID:        "1"
      NUM_CLIENTS:      "3"
      ROUNDS:           "10"
      LOCAL_EPOCHS:     "3"
      CLIP_NORM:        "1.0"
      NOISE_MULTIPLIER: "1.1"
      DELTA:            "1e-5"

  client-2:
    build: ./client
    container_name: fl-client-2
    depends_on:
      server:
        condition: service_healthy
    environment:
      SERVER_URL:       http://server:5000
      CLIENT_ID:        "2"
      NUM_CLIENTS:      "3"
      ROUNDS:           "10"
      LOCAL_EPOCHS:     "3"
      CLIP_NORM:        "1.0"
      NOISE_MULTIPLIER: "1.1"
      DELTA:            "1e-5"
